services:
  ghost-ses-proxy:
    build: .
    ports:
      - "127.0.0.1:3003:3003"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      PORT: "3003"
      SEND_CONCURRENCY: "${SEND_CONCURRENCY:-10}"
    networks:
      - ses
    restart: unless-stopped

networks:
  ses:
    external: true
    name: mailgun-ses-proxy_SESproxy
